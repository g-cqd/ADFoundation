name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On-demand trigger (family parity): re-drive CI against the current reusable-workflow v1
  # without an artificial commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Type-check-budget calibration for the manifest's env-tunable -warn-long-* flags on the BESPOKE
# jobs below (the reusable swift-quality workflow exports its own copy for the common legs):
# 250 ms absorbs shared-runner wall-time noise; local builds keep the strict 100 ms default.
env:
  AD_TYPECHECK_BUDGET_MS: "250"

jobs:
  quality:
    # Exercise compatibility imports against the published Aemi implementation.
    uses: Aemi-Studio/aemi/.github/workflows/swift-quality.yml@main
    with:
      # arcleak and dolly GATE (arcleak measured 0 findings family-wide; dolly runs the token
      # pass against .dolly-baseline.json, so only NEW clones fail). deadwood is report-only —
      # its syntax-mode dataflow cannot see writes through closures or mutating methods.
      enable-static-analysis: true
      dev-env-var: ADF_DEV
      enable-sanitizers: true
      sanitizers: "address thread"
      enable-coverage: true
      enable-docs: false

  strict-warnings:
    name: Warnings as errors (core tiers)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # No hosted macOS image ships Swift 6.4 (this package's tools-version); install the family's
      # pinned swift.org 6.4 dev snapshot, the same mechanism as the reusable workflow's macOS legs.
      - name: Install Swift 6.4 dev toolchain
        uses: Aemi-Studio/aemi/.github/actions/setup-swift@main
      # Package.swift scopes warnings-as-errors to this package's targets.
      # A global driver flag conflicts with SwiftPM's suppression for dependencies.
      - name: Build compatibility targets with strict package settings
        run: swift build --target ADFoundation

  strict-warnings-linux:
    name: Warnings as errors (core tiers, Linux)
    runs-on: ubuntu-latest
    # Dated nightly pins the toolchain for reproducible CI; bump deliberately like a dependency (#14).
    container: swiftlang/swift:nightly-6.4.x-noble@sha256:54970846d48a8255eee5986aa5bbd259b7f73bbf38429cc2428ce6a62a390b47
    steps:
      - uses: actions/checkout@v4
      # Use the same target-scoped strict settings on Linux.
      - name: Build compatibility targets with strict package settings
        run: swift build --target ADFoundation

  tier-isolation:
    name: Tier isolation (core tiers stay swift-syntax-free)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # No hosted macOS image ships Swift 6.4 — see strict-warnings.
      - name: Install Swift 6.4 dev toolchain
        uses: Aemi-Studio/aemi/.github/actions/setup-swift@main
      # The package's defining invariant: the zero-dependency products (ADFCore / ADFUnicode /
      # ADFText / ADFIO and the ADFoundation umbrella) must never transitively link swift-syntax, so
      # the portable ADJSONCore and the apple-docs dylib keep clean resolution graphs. Build each in
      # isolation and fail if swift-syntax ever gets compiled as part of it. (Only ADFMacroSupport,
      # built separately, is allowed to.)
      - name: Build each core product and assert no swift-syntax compilation
        run: |
          rm -rf .build
          swift package resolve
          for product in ADFCore ADFUnicode ADFText ADFIO ADFoundation; do
            log=$(swift build --target "$product" 2>&1)
            echo "$log"
            if echo "$log" | grep -qiE 'Compiling (SwiftSyntax|SwiftParser|SwiftDiagnostics)'; then
              echo "::error::$product transitively compiled swift-syntax — core tiers must stay swift-syntax-free"
              exit 1
            fi
          done

  sanitizers-linux:
    name: Sanitizer Linux (${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    # Dated nightly pins the toolchain for reproducible CI; bump deliberately like a dependency (#14).
    container: swiftlang/swift:nightly-6.4.x-noble@sha256:54970846d48a8255eee5986aa5bbd259b7f73bbf38429cc2428ce6a62a390b47
    strategy:
      fail-fast: false
      matrix:
        # Address catches the Glibc-path pointer/mmap code; undefined covers the C11 atomics shim
        # and pointer arithmetic. (Both pass locally on macOS; Linux exercises the #else branches.)
        # The macOS sanitizer matrix (address + thread) runs in the reusable `quality` job above; this
        # Linux pass is package-unique because the reusable's sanitizer leg is macOS-only.
        sanitize: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Test under ${{ matrix.sanitize }}Sanitizer
        env:
          # Linux ASan enables LeakSanitizer by default (macOS does not), and corelibs-xctest's
          # XCTMain harness itself leaks a fixed 432 bytes / 7 allocations per runner process
          # ("Executed 0 tests" — the empty XCTest half of a swift-testing bundle). Suppress by
          # XCTest symbol scope only, so genuine leaks in package code still fail the leg.
          LSAN_OPTIONS: suppressions=.github/lsan-suppressions.txt
          # UBSan otherwise reports undefined behavior without failing the test process.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "${{ matrix.sanitize }}" = "undefined" ]; then
            # Swift's Linux frontend rejects UBSan. Instrument the C kernels and pass the
            # same flag to Clang's linker so it supplies the matching sanitizer runtime.
            swift test --build-system native -Xcc -fsanitize=undefined \
              -Xswiftc -Xclang-linker -Xswiftc -fsanitize=undefined
          else
            swift test --sanitize=${{ matrix.sanitize }}
          fi

  dev-build:
    name: Dev build (plugins, benchmarks)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # No hosted macOS image ships Swift 6.4 — see strict-warnings.
      - name: Install Swift 6.4 dev toolchain
        uses: Aemi-Studio/aemi/.github/actions/setup-swift@main
      # Keep the compatibility benchmark and lint-plugin graph buildable.
      # Implementation documentation is maintained in Aemi.
      - name: Build dev targets
        run: ADF_DEV=1 swift build
